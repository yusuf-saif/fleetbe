openapi: 3.0.3
info:
  title: 'FleetManagement API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Authentication
    description: ''
  -
    name: 'Driver Authentication'
    description: ''
  -
    name: Drivers
    description: 'This endpoint registers a new driver in the system.'
  -
    name: Endpoints
    description: ''
  -
    name: Fuels
    description: ''
  -
    name: Maintenances
    description: "\nAPIs for managing maintenance configurations"
  -
    name: 'Resource & Maintenance Requests'
    description: "\nAPIs for managing fuel, spare part, and maintenance requests"
  -
    name: 'Spare Parts'
    description: "\nAPIs for managing spare parts"
  -
    name: Suppliers
    description: "\nAPIs for managing suppliers"
  -
    name: 'Vehicle Assignments'
    description: "\nAPIs for managing vehicle assignments"
  -
    name: Vehicles
    description: ''
paths:
  /api/v1/auth/register:
    post:
      summary: 'Register a new user'
      operationId: registerANewUser
      description: 'This endpoint registers a user and returns the user details with a token.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User registered and logged in successfully'
                  user:
                    id: 1
                    name: 'Hassan Sani'
                    email: hassan@example.com
                properties:
                  message:
                    type: string
                    example: 'User registered and logged in successfully'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Hassan Sani'
                      email:
                        type: string
                        example: hassan@example.com
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The name of the user.'
                  example: 'Hassan Sani'
                  nullable: false
                email:
                  type: string
                  description: 'The email of the user.'
                  example: hassan@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The password.'
                  example: secret123
                  nullable: false
                password_confirmation:
                  type: string
                  description: 'Confirm the password.'
                  example: secret123
                  nullable: false
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Login a user'
      operationId: loginAUser
      description: 'This endpoint allows a user to log in and receive a Bearer token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Login successful'
                  token: 1|ZpRzVvq4UIq2p...xyz
                  user:
                    id: 1
                    name: 'Hassan Sani'
                    email: hassan@example.com
                    organization_staff:
                      id: 5
                      staff_position: Manager
                      staff_status: Active
                      staff_level: Senior
                      organization:
                        id: 2
                        organization_name: 'Finecore Ltd'
                properties:
                  message:
                    type: string
                    example: 'Login successful'
                  token:
                    type: string
                    example: 1|ZpRzVvq4UIq2p...xyz
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Hassan Sani'
                      email:
                        type: string
                        example: hassan@example.com
                      organization_staff:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 5
                          staff_position:
                            type: string
                            example: Manager
                          staff_status:
                            type: string
                            example: Active
                          staff_level:
                            type: string
                            example: Senior
                          organization:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 2
                              organization_name:
                                type: string
                                example: 'Finecore Ltd'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The user’s email.'
                  example: hassan@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The user’s password.'
                  example: secret123
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Logout the current user'
      operationId: logoutTheCurrentUser
      description: 'This endpoint revokes the current access token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logged out successfully'
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully'
      tags:
        - Authentication
  /api/v1/auth/forgot-password:
    post:
      summary: 'Forgot password (send reset link)'
      operationId: forgotPasswordsendResetLink
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                  nullable: false
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                  nullable: false
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                  nullable: false
                password:
                  type: string
                  description: 'Must be at least 6 characters.'
                  example: '-0pBNvYgxw'
                  nullable: false
              required:
                - token
                - email
                - password
      security: []
  /api/v1/driver/login:
    post:
      summary: 'Login a driver'
      operationId: loginADriver
      description: 'This endpoint allows a user to log in and receive a Bearer token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Login successful'
                  token: 1|ZpRzVvq4UIq2p...xyz
                  user:
                    id: 1
                    name: 'Hassan Sani'
                    email: hassan@example.com
                properties:
                  message:
                    type: string
                    example: 'Login successful'
                  token:
                    type: string
                    example: 1|ZpRzVvq4UIq2p...xyz
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Hassan Sani'
                      email:
                        type: string
                        example: hassan@example.com
      tags:
        - 'Driver Authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The user’s email.'
                  example: hassan@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The user’s password.'
                  example: secret123
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/v1/driver/change-password:
    post:
      summary: ''
      operationId: postApiV1DriverChangePassword
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Driver Authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. The <code>email</code> of an existing record in the drivers table.'
                  example: gbailey@example.net
                  nullable: false
                pin:
                  type: string
                  description: 'Must be 6 digits.'
                  example: '569775'
                  nullable: false
                new_password:
                  type: string
                  description: 'Must be at least 6 characters.'
                  example: ngzmiyvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwt
                  nullable: false
              required:
                - email
                - pin
                - new_password
      security: []
  /api/v1/driver/forgot-password:
    post:
      summary: 'Forgot password (send reset link)'
      operationId: forgotPasswordsendResetLink
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Driver Authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                  nullable: false
              required:
                - email
      security: []
  /api/v1/driver/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Driver Authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                  nullable: false
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                  nullable: false
                password:
                  type: string
                  description: 'Must be at least 6 characters.'
                  example: '-0pBNvYgxw'
                  nullable: false
              required:
                - token
                - email
                - password
      security: []
  /api/v1/driver/logout:
    post:
      summary: ''
      operationId: postApiV1DriverLogout
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Driver Authentication'
      security: []
  /api/v1/driver/register:
    post:
      summary: 'Register a new driver'
      operationId: registerANewDriver
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'John Doe'
                  email: john@example.com
                  phone_number: '08012345678'
                  organization_id: 1
                  driver_license: ABC12345
                  license_expiry_date: '2026-05-01'
                  next_kin_name: 'Jane Doe'
                  next_kin_relationship: Sister
                  next_kin_phone: '08098765432'
                  next_kin_email: jane@example.com
                  next_kin_residential_address: '10 First Avenue, Abuja'
                  blood_group: O+
                  genotype: AA
                  allergies:
                    - Peanuts
                    - Dust
                  medical_challenge:
                    - Asthma
                    - Hypertension
                  eye_condition:
                    - Short-sightedness
                  residential_address: '12 Main Street, Abuja'
                  home_address: '5 Old Road, Kano'
                  state: Lagos
                  lga: Ikeja
                  town: Ojodu
                  nationality: Nigerian
                  state_of_origin: Kaduna
                  lga_of_origin: Zaria
                  town_of_origin: Samaru
                  date_of_birth: '1990-06-15'
                  created_at: '2025-09-20T10:00:00.000000Z'
                  updated_at: '2025-09-20T10:00:00.000000Z'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'John Doe'
                  email:
                    type: string
                    example: john@example.com
                  phone_number:
                    type: string
                    example: '08012345678'
                  organization_id:
                    type: integer
                    example: 1
                  driver_license:
                    type: string
                    example: ABC12345
                  license_expiry_date:
                    type: string
                    example: '2026-05-01'
                  next_kin_name:
                    type: string
                    example: 'Jane Doe'
                  next_kin_relationship:
                    type: string
                    example: Sister
                  next_kin_phone:
                    type: string
                    example: '08098765432'
                  next_kin_email:
                    type: string
                    example: jane@example.com
                  next_kin_residential_address:
                    type: string
                    example: '10 First Avenue, Abuja'
                  blood_group:
                    type: string
                    example: O+
                  genotype:
                    type: string
                    example: AA
                  allergies:
                    type: array
                    example:
                      - Peanuts
                      - Dust
                    items:
                      type: string
                  medical_challenge:
                    type: array
                    example:
                      - Asthma
                      - Hypertension
                    items:
                      type: string
                  eye_condition:
                    type: array
                    example:
                      - Short-sightedness
                    items:
                      type: string
                  residential_address:
                    type: string
                    example: '12 Main Street, Abuja'
                  home_address:
                    type: string
                    example: '5 Old Road, Kano'
                  state:
                    type: string
                    example: Lagos
                  lga:
                    type: string
                    example: Ikeja
                  town:
                    type: string
                    example: Ojodu
                  nationality:
                    type: string
                    example: Nigerian
                  state_of_origin:
                    type: string
                    example: Kaduna
                  lga_of_origin:
                    type: string
                    example: Zaria
                  town_of_origin:
                    type: string
                    example: Samaru
                  date_of_birth:
                    type: string
                    example: '1990-06-15'
                  created_at:
                    type: string
                    example: '2025-09-20T10:00:00.000000Z'
                  updated_at:
                    type: string
                    example: '2025-09-20T10:00:00.000000Z'
      tags:
        - Drivers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The driver's full name."
                  example: 'John Doe'
                  nullable: false
                email:
                  type: string
                  description: 'Unique email address.'
                  example: john@example.com
                  nullable: false
                phone_number:
                  type: string
                  description: 'Unique phone number.'
                  example: '08012345678'
                  nullable: false
                password:
                  type: string
                  description: "The driver's password (nullable, default is generated if empty)."
                  example: secret123
                  nullable: true
                organization_id:
                  type: integer
                  description: 'The ID of the organization the driver belongs to.'
                  example: 1
                  nullable: false
                driver_license:
                  type: string
                  description: "The driver's license number."
                  example: ABC12345
                  nullable: false
                license_expiry_date:
                  type: date
                  description: "Expiry date of the driver's license."
                  example: '2026-05-01'
                  nullable: false
                next_kin_name:
                  type: string
                  description: "The next of kin's name."
                  example: 'Jane Doe'
                  nullable: true
                next_kin_relationship:
                  type: string
                  description: 'The relationship with next of kin.'
                  example: Sister
                  nullable: true
                next_kin_phone:
                  type: string
                  description: "The next of kin's phone number."
                  example: '08098765432'
                  nullable: true
                next_kin_email:
                  type: string
                  description: "The next of kin's email address."
                  example: jane@example.com
                  nullable: true
                next_kin_residential_address:
                  type: string
                  description: 'The residential address of next of kin.'
                  example: '10 First Avenue, Abuja'
                  nullable: true
                blood_group:
                  type: string
                  description: 'The blood group of the driver.'
                  example: O+
                  nullable: true
                genotype:
                  type: string
                  description: 'The genotype of the driver.'
                  example: AA
                  nullable: true
                allergies:
                  type: array
                  description: 'A list of allergies (array of strings).'
                  example:
                    - Peanuts
                    - Dust
                  items:
                    type: string
                medical_challenge:
                  type: array
                  description: 'A list of medical challenges (array of strings).'
                  example:
                    - Asthma
                    - Hypertension
                  items:
                    type: string
                eye_condition:
                  type: array
                  description: 'A list of eye conditions (array of strings).'
                  example:
                    - Short-sightedness
                  items:
                    type: string
                residential_address:
                  type: string
                  description: 'The residential address of the driver.'
                  example: '12 Main Street, Abuja'
                  nullable: true
                home_address:
                  type: string
                  description: 'The home address of the driver.'
                  example: '5 Old Road, Kano'
                  nullable: true
                state:
                  type: string
                  description: 'The state where the driver lives.'
                  example: Lagos
                  nullable: true
                lga:
                  type: string
                  description: 'The LGA where the driver lives.'
                  example: Ikeja
                  nullable: true
                town:
                  type: string
                  description: 'The town where the driver lives.'
                  example: Ojodu
                  nullable: true
                nationality:
                  type: string
                  description: 'The nationality of the driver.'
                  example: Nigerian
                  nullable: true
                state_of_origin:
                  type: string
                  description: 'The state of origin.'
                  example: Kaduna
                  nullable: true
                lga_of_origin:
                  type: string
                  description: 'The LGA of origin.'
                  example: Zaria
                  nullable: true
                town_of_origin:
                  type: string
                  description: 'The town of origin.'
                  example: Samaru
                  nullable: true
                date_of_birth:
                  type: date
                  description: 'The date of birth.'
                  example: '1990-06-15'
                  nullable: true
              required:
                - name
                - email
                - phone_number
                - organization_id
                - driver_license
                - license_expiry_date
      security: []
  /api/v1/driver:
    get:
      summary: 'List drivers'
      operationId: listDrivers
      description: 'Paginated list of drivers. Each driver includes `organization` and `vehicles`.'
      parameters:
        -
          in: query
          name: page
          description: 'The page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'The page number.'
            example: 1
            nullable: false
        -
          in: query
          name: per_page
          description: 'Results per page.'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Results per page.'
            example: 10
            nullable: false
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'John Doe'
                      email: john@example.com
                      organization:
                        id: 1
                        name: 'Org Ltd'
                      vehicles:
                        -
                          id: 2
                          name: 'Toyota Hiace'
                          plate_number: ABC123
                  links: {  }
                  meta: {  }
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'John Doe'
                        email: john@example.com
                        organization:
                          id: 1
                          name: 'Org Ltd'
                        vehicles:
                          -
                            id: 2
                            name: 'Toyota Hiace'
                            plate_number: ABC123
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'John Doe'
                        email:
                          type: string
                          example: john@example.com
                        organization:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'Org Ltd'
                        vehicles:
                          type: array
                          example:
                            -
                              id: 2
                              name: 'Toyota Hiace'
                              plate_number: ABC123
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 2
                              name:
                                type: string
                                example: 'Toyota Hiace'
                              plate_number:
                                type: string
                                example: ABC123
                  links:
                    type: object
                    properties: {  }
                  meta:
                    type: object
                    properties: {  }
      tags:
        - Drivers
      security: []
  '/api/v1/driver/{id}':
    get:
      summary: 'Get a driver'
      operationId: getADriver
      description: 'Returns a driver with `organization` and `vehicles`.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'John Doe'
                  email: john@example.com
                  organization:
                    id: 1
                    name: 'Org Ltd'
                  vehicles:
                    -
                      id: 2
                      name: 'Toyota Hiace'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'John Doe'
                  email:
                    type: string
                    example: john@example.com
                  organization:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Org Ltd'
                  vehicles:
                    type: array
                    example:
                      -
                        id: 2
                        name: 'Toyota Hiace'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: 'Toyota Hiace'
      tags:
        - Drivers
      security: []
    delete:
      summary: 'Delete a driver'
      operationId: deleteADriver
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Driver deleted successfully'
                properties:
                  message:
                    type: string
                    example: 'Driver deleted successfully'
      tags:
        - Drivers
      security: []
    put:
      summary: 'Update a driver'
      operationId: updateADriver
      description: 'Update driver fields. Password is optional; when present it will be hashed.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Driver updated successfully'
                  data:
                    id: 1
                    name: 'Updated Name'
                    organization:
                      id: 1
                      name: 'Org Ltd'
                    vehicles: []
                properties:
                  message:
                    type: string
                    example: 'Driver updated successfully'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Updated Name'
                      organization:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Org Ltd'
                      vehicles:
                        type: array
                        example: []
      tags:
        - Drivers
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The driver's name."
                  example: architecto
                  nullable: false
                email:
                  type: string
                  description: "The driver's email."
                  example: gbailey@example.net
                  nullable: false
                phone_number:
                  type: string
                  description: "The driver's phone number."
                  example: architecto
                  nullable: false
                password:
                  type: string
                  description: 'The new password (optional).'
                  example: '|]|{+-'
                  nullable: true
                next_kin_name:
                  type: string
                  description: "Next of kin name.\n// (other fields may be provided; see model for full list)"
                  example: architecto
                  nullable: true
                next_kin_relationship:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: w
                  nullable: true
                next_kin_phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: aykcmyuwpwlvqwrs
                  nullable: true
                next_kin_email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: bauch.marcelo@example.com
                  nullable: true
                next_kin_residential_address:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                blood_group:
                  type: string
                  description: ''
                  example: null
                  nullable: true
                genotype:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                allergies:
                  type: array
                  description: 'Must not be greater than 255 characters.'
                  example:
                    - 'n'
                  items:
                    type: string
                medical_challenge:
                  type: array
                  description: 'Must not be greater than 255 characters.'
                  example:
                    - g
